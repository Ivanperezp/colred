    <button id="menu" class="menu" type="button" aria-expanded="false" aria-controls="nav" aria-label="Menú"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
